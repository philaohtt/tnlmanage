<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Migration - LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .auth-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .fade-in { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .progress-fill {
      transition: width 1s linear;
    }
  </style>
 </head>
 <body class="h-full auth-gradient flex items-center justify-center p-6">

  <div class="w-full max-w-lg fade-in">
    <!-- Icon -->
    <div class="text-center mb-8">
     <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
     </div>
     <h1 class="text-3xl font-bold text-white mb-2">System Migration</h1>
    </div>

    <!-- Migration Message Card -->
    <div class="auth-card rounded-3xl p-10 text-center">
     <h2 class="text-2xl font-semibold text-gray-900 mb-6">This webpage is no longer available.</h2>
     
     <div class="space-y-4 text-gray-600 leading-relaxed text-lg">
       <p>You will be directed to the new system at <br>
          <a href="https://tnl-lms.web.app" class="text-indigo-600 font-bold hover:underline">tnl-lms.web.app</a>
       </p>
       
       <p class="bg-indigo-50 p-4 rounded-xl text-sm border border-indigo-100">
         You can use the <strong>same username and password</strong> to log in.
       </p>
       
       <p class="text-sm font-medium">You should save this new page for future uses.</p>
     </div>

     <!-- Countdown & Progress Bar -->
     <div class="mt-8">
       <p class="text-xs text-gray-400 mb-2">Redirecting in <span id="countdown" class="font-bold text-indigo-600">10</span> seconds...</p>
       <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
         <div id="progress" class="progress-fill bg-indigo-600 h-full" style="width: 0%"></div>
       </div>
     </div>

     <a href="https://tnl-lms.web.app" class="mt-8 inline-block w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-700 text-white font-semibold hover:shadow-lg transition-all">
       Go to New System Now
     </a>
    </div>
  </div>

  <script>
    const destination = "https://tnl-lms.web.app";
    let timeLeft = 10;
    const totalTime = 10;
    
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');

    const timer = setInterval(() => {
      timeLeft--;
      
      // Update text
      countdownEl.textContent = timeLeft;
      
      // Update progress bar width
      const percentage = ((totalTime - timeLeft) / totalTime) * 100;
      progressEl.style.width = percentage + '%';

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = destination;
      }
    }, 1000);
  </script>
 </body>
</html>
